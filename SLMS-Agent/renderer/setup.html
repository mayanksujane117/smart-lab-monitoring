<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8" />

  <title>
    SLMS Agent Setup
  </title>

  <link
    rel="stylesheet"
    href="./style.css"
  />

</head>

<body>

  <div class="container">

    <div class="card">

      <h1>
        SLMS Agent
      </h1>

      <p>
        Smart Lab Monitoring System
      </p>

      <input

        id="pcName"

        type="text"

        placeholder="Enter PC Name"

      />

      <input

        id="labName"

        type="text"

        placeholder="Enter Lab Name"

      />

      <button
        id="saveBtn"
      >

        Save & Start Agent

      </button>

      <div
        id="message"
      ></div>

    </div>

  </div>

  <script src="./setup.js"></script>

</body>

</html>
